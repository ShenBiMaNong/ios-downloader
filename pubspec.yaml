name: video_downloader
description: "内置浏览器视频下载器（个人自用，sideload 安装）"
publish_to: "none"
version: 0.3.10+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 内置浏览器（iOS 底层 WKWebView）
  webview_flutter: ^4.10.0
  # mp4 直链下载
  dio: ^5.7.0
  # 沙盒路径
  path_provider: ^2.1.5
  path: ^1.9.0
  # 本地播放
  video_player: ^2.9.2
  # 边播边缓存（本地 HTTP 代理：播放字节 == 落盘字节，缓存文件即最终产物）
  http_cache_stream: ^0.3.2
  # http_cache_stream 自定义请求头客户端（Referer/UA 防盗链）
  http: ^1.2.0
  material_ui: ^1.11.0
  ffmpeg_kit_flutter_new_min: ^3.6.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # 测试中替换 PathProviderPlatform，指向临时目录（验证资源库重命名/删除）
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/sniffer.js
    - assets/adblock.js
    - assets/redirect_guard.js
    - assets/video_marker.js
    - assets/no_autoplay.js
    - assets/browser_swipe.js
