name: Build unsigned IPA

# 云端 macOS 构建，产出「未签名 IPA」
# 注意：私有仓库免费额度 macOS 按 10 倍消耗（约 200 分钟/月），一次构建约 20-40 分钟
# 触发方式：仅手动触发（Actions 页 Run workflow）或推送 v* 版本标签时构建，
# 避免每次提交到 main 都消耗有限的 macOS 构建分钟额度
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 平台工程（ios/ android/）已提交，勿再跑 flutter create（会重新生成模板测试文件）
      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build unsigned app
        # flutter build ipa --no-codesign 在 3.50 只产 xcarchive 不产 ipa，故手动组装
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload
          mkdir -p build/ios/ipa
          mv Runner.ipa build/ios/ipa/Runner.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-unsigned-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
